name: collect

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests tldextract

      - name: Collect
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          CITEDRIFT_RUNNER: actions
        run: python -m citedrift.collect

      - name: Rebuild analysis and report
        run: |
          python -m citedrift.parse
          python -m citedrift.normalize
          python -m citedrift.analyze
          python -m citedrift.report
          mkdir -p docs
          cp report/report.html docs/index.html

      - name: Commit
        run: |
          git config user.name "citedrift-bot"
          git config user.email "actions@github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "collect: $(date -u +%Y%m%dT%H%M%SZ)"
          git push
