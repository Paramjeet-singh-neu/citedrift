name: collect

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Collect
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python -m citedrift.collect

      - name: Commit raw data
        run: |
          git config user.name "citedrift-bot"
          git config user.email "actions@github.com"
          git add data/raw
          git diff --staged --quiet || git commit -m "collect: $(date -u +%Y%m%dT%H%M%SZ)"
          git push
